name: Sync News Cache to CDN

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pg
        run: npm install pg --no-save

      - name: Export fresh news from Database
        run: node scripts/export_fresh_data_from_db.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes in news data"
          else
            git commit -m "Auto-sync latest news data directly from DB [skip ci]"
            git push
            categories=("global" "domestic" "business" "tech" "money" "culture")
            for cat in "${categories[@]}"; do
              curl -s "https://purge.jsdelivr.net/gh/Zenglian990/zenglian-news@main/data/${cat}.json" || true
            done
          fi
