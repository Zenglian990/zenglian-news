name: Sync News Cache to CDN

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest news from Render API
        run: |
          mkdir -p data
          categories=("global" "domestic" "business" "tech" "money" "culture")
          for cat in "${categories[@]}"; do
            echo "Fetching $cat..."
            curl -s "https://zenglian-news.onrender.com/api/v1/items?category=$cat&limit=30&mode=all&window=7d" -o "data/${cat}.json" || true
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes in news data"
          else
            git commit -m "Auto-sync latest news data [skip ci]"
            git push
          fi
