name: Sync News Cache to CDN

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install pg postgres fast-xml-parser cheerio --no-save

      - name: Crawl live RSS feeds and translate with DeepSeek
        run: node scripts/inject_premium_sources.mjs || true

      - name: Export fresh news from Database
        run: node scripts/export_fresh_data_from_db.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ data-v2/
          if git diff --staged --quiet; then
            echo "No changes in news data"
          else
            git commit -m "Auto-sync latest news data [skip ci]"
            git push
            categories=("global" "domestic" "business" "tech" "money" "culture" "reports")
            for cat in "${categories[@]}"; do
              curl -s "https://purge.jsdelivr.net/gh/Zenglian990/zenglian-news@main/data/${cat}.json" || true
              curl -s "https://purge.jsdelivr.net/gh/Zenglian990/zenglian-news@main/data-v2/${cat}.json" || true
            done
          fi
