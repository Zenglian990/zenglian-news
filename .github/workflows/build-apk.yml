name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ZenglianNews v3.1.1 APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ZenglianNews-v3.1.1-pro.apk

      - name: Publish APK to v3.1.1 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v3.1.1 >/dev/null 2>&1; then
            gh release upload v3.1.1 ZenglianNews-v3.1.1-pro.apk --clobber
            gh release edit v3.1.1 --latest
          else
            gh release create v3.1.1 ZenglianNews-v3.1.1-pro.apk \
              --title "ZenglianNews Pro v3.1.1" \
              --notes "修复文章详情页在 Android 15 / 底部三键导航栏机型上被系统导航栏遮挡、按钮点按不到的问题：将阅读器从独立 Dialog 窗口重构为主窗口全屏覆盖层，精准适配系统导航栏与状态栏安全区，并完整支持返回键关闭。" \
              --latest
          fi
